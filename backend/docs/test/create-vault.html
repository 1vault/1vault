<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1Vault — Create Vault Wallet Test</title>
  <style>
    :root {
      --navy: #0f2854;
      --blue-dark: #1c4d8d;
      --blue: #4988c4;
      --sky: #bde8f5;
      --muted: #8eb8d4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--navy);
      color: var(--sky);
      line-height: 1.5;
    }
    main {
      max-width: 48rem;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
    code { color: var(--sky); font-size: 0.85em; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 1.25rem; }
    label { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; flex: 1; min-width: 10rem; }
    input, select {
      background: transparent;
      border: 1px solid color-mix(in srgb, var(--blue) 60%, transparent);
      border-radius: 0.5rem;
      padding: 0.55rem 0.75rem;
      color: var(--sky);
      font: inherit;
    }
    input.mono { font-family: ui-monospace, monospace; font-size: 0.85rem; }
    button {
      border: none;
      border-radius: 0.5rem;
      padding: 0.55rem 1rem;
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      color: #fff;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-connect { background: var(--blue); }
    .btn-run { background: #047857; padding: 0.75rem 1.25rem; font-weight: 600; }
    .panel {
      border: 1px solid color-mix(in srgb, var(--blue) 35%, transparent);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 1rem;
      background: color-mix(in srgb, var(--blue-dark) 40%, transparent);
    }
    .panel h2 { font-size: 0.85rem; margin: 0 0 0.5rem; }
    pre {
      margin: 0;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 16rem;
      overflow: auto;
    }
    pre.json { max-height: 24rem; }
    .wallet-pk { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); }
    .meta { font-size: 0.75rem; color: var(--muted); margin-top: 1.5rem; }
    a { color: var(--sky); }
  </style>
</head>
<body>
  <main>
    <h1>Create Vault — Wallet Test</h1>
    <p>
      Phantom or Solflare on <strong>devnet</strong> → <code>POST /v1/flows</code>.
      Backend co-signs ephemeral key for <code>create_vault</code>.
      <a href="/v1/docs">API docs</a>
    </p>

    <div class="row">
      <button type="button" id="connect" class="btn-connect">Connect wallet</button>
      <span id="walletPk" class="wallet-pk"></span>
    </div>

    <div class="row">
      <label>
        Cluster
        <select id="cluster">
          <option value="devnet" selected>devnet</option>
          <option value="mainnet-beta">mainnet-beta</option>
        </select>
      </label>
      <label>
        Vault ID
        <input id="vaultId" class="mono" type="number" min="1" value="12" />
      </label>
      <label>
        Name
        <input id="vaultName" type="text" value="Test vault" />
      </label>
    </div>

    <button type="button" id="run" class="btn-run">Run create-vault flow</button>

    <div class="panel" id="flowPanel" hidden>
      <h2>Flow</h2>
      <pre id="flowJson" class="json"></pre>
    </div>

    <div class="panel">
      <h2>Log</h2>
      <pre id="log">—</pre>
    </div>

    <p class="meta" id="meta"></p>
  </main>

  <script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>
  <script>
    const { Transaction, VersionedTransaction } = solanaWeb3;

    const $ = (id) => document.getElementById(id);
    const logs = [];

    function append(msg) {
      const t = new Date().toLocaleTimeString();
      logs.push(`[${t}] ${msg}`);
      $("log").textContent = logs.join("\n");
    }

    function clusterQS() {
      return "?cluster=" + encodeURIComponent($("cluster").value);
    }

    function getWallet() {
      if (window.solana?.isPhantom) return window.solana;
      if (window.solflare?.isSolflare) return window.solflare;
      return window.solana || null;
    }

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function bytesToB64(bytes) {
      let s = "";
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }

    function deserializeTx(b64) {
      const bytes = b64ToBytes(b64);
      try {
        return Transaction.from(bytes);
      } catch {
        return VersionedTransaction.deserialize(bytes);
      }
    }

    function serializeSigned(tx) {
      const bytes =
        tx instanceof VersionedTransaction
          ? tx.serialize()
          : tx.serialize({ requireAllSignatures: false, verifySignatures: false });
      return bytesToB64(bytes);
    }

    async function api(path, init) {
      const res = await fetch(path, {
        ...init,
        headers: { "Content-Type": "application/json", ...(init?.headers || {}) },
      });
      const json = await res.json();
      if (!res.ok || !json.success) {
        throw new Error((json.error && json.error.message) || "HTTP " + res.status);
      }
      return json.data;
    }

    function currentAwaitingStep(job) {
      return (job.steps || []).find(
        (s) =>
          s.seq === job.currentStep &&
          (s.status === "awaiting_signature" || s.status === "pending")
      );
    }

    let walletPk = null;

    $("connect").addEventListener("click", async () => {
      try {
        const wallet = getWallet();
        if (!wallet) throw new Error("Phantom/Solflare not detected");
        const { publicKey } = await wallet.connect();
        walletPk = publicKey.toBase58();
        $("walletPk").textContent = walletPk;
        append("Connected: " + walletPk);
      } catch (e) {
        append("ERROR: " + e.message);
      }
    });

    async function refreshFlow(id) {
      const job = await api("/v1/flows/" + id + clusterQS());
      $("flowPanel").hidden = false;
      $("flowJson").textContent = JSON.stringify(job, null, 2);
      return job;
    }

    async function waitForStatus(id, want, timeoutMs = 90000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        const job = await refreshFlow(id);
        if (want.includes(job.status)) return job;
        if (job.status === "failed" || job.status === "cancelled") {
          throw new Error(job.error || "flow " + job.status);
        }
        await new Promise((r) => setTimeout(r, 1500));
      }
      throw new Error("timeout waiting for flow status");
    }

    async function signAndSubmitCurrent(job) {
      const wallet = getWallet();
      if (!wallet?.publicKey) throw new Error("Wallet not connected");

      const step = currentAwaitingStep(job);
      if (!step?.prepared?.transaction) throw new Error("No step awaiting signature");

      const signer = step.signerPubkey || (step.signerDetails && step.signerDetails[0]?.pubkey);
      const myPk = wallet.publicKey.toBase58();
      if (signer && signer !== myPk) {
        throw new Error(
          'Step "' + step.name + '" requires ' + signer + ", not " + myPk + ". Switch wallet."
        );
      }

      const mode = (step.prepared && step.prepared.signingMode) || "eoa";
      append("Signing step " + step.seq + ": " + step.name + " (" + mode + ")");

      const tx = deserializeTx(step.prepared.transaction);
      const signed = await wallet.signTransaction(tx);
      const signedB64 = serializeSigned(signed);

      append("Submitting step " + step.seq + "…");
      const updated = await api("/v1/flows/" + job.id + "/submit" + clusterQS(), {
        method: "POST",
        body: JSON.stringify({ signedTransaction: signedB64 }),
      });
      $("flowJson").textContent = JSON.stringify(updated, null, 2);
      append("Submitted — flow status: " + updated.status);
      return updated;
    }

    $("run").addEventListener("click", async () => {
      const runBtn = $("run");
      runBtn.disabled = true;
      runBtn.textContent = "Running…";
      try {
        if (!walletPk) {
          const wallet = getWallet();
          if (!wallet) throw new Error("Phantom/Solflare not detected");
          const { publicKey } = await wallet.connect();
          walletPk = publicKey.toBase58();
          $("walletPk").textContent = walletPk;
          append("Connected: " + walletPk);
        }

        const vaultId = Number($("vaultId").value);
        if (!Number.isFinite(vaultId) || vaultId <= 0) {
          throw new Error("vaultId must be > 0");
        }

        append("Starting create-vault flow…");
        const job = await api("/v1/flows" + clusterQS(), {
          method: "POST",
          body: JSON.stringify({
            mode: "create-vault",
            strategist: walletPk,
            vaultId,
            name: $("vaultName").value || "Test vault",
            vaultType: "pooled",
          }),
        });
        $("flowPanel").hidden = false;
        $("flowJson").textContent = JSON.stringify(job, null, 2);
        append("Flow started: " + job.id);
        if (job.context?.vaultTokenAccount) {
          append("vaultTokenAccount: " + job.context.vaultTokenAccount);
        }

        let current = job;
        for (let guard = 0; guard < 30; guard++) {
          if (current.status === "completed") {
            append("Flow completed!");
            return;
          }
          if (current.status === "failed") throw new Error(current.error || "flow failed");

          if (current.status === "awaiting_signature") {
            current = await signAndSubmitCurrent(current);
            current = await waitForStatus(current.id, [
              "awaiting_signature",
              "confirming",
              "completed",
              "failed",
            ]);
            continue;
          }

          if (current.status === "confirming") {
            append("Confirming on-chain + ingest…");
            current = await waitForStatus(current.id, [
              "awaiting_signature",
              "completed",
              "failed",
            ]);
            continue;
          }

          current = await waitForStatus(current.id, [
            "awaiting_signature",
            "confirming",
            "completed",
          ]);
        }
        throw new Error("Too many steps — inspect flow JSON");
      } catch (e) {
        append("ERROR: " + e.message);
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "Run create-vault flow";
      }
    });

    $("meta").textContent =
      "API: " + window.location.origin + " · Wallet needs devnet SOL + 1VL license. Use a unique vaultId.";
  </script>
</body>
</html>

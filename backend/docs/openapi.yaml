        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxStrategistOnlyBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/resolve-accounts:
    post:
      tags: [Tx · Setup]
      summary: Resolve vault/strategist PDAs
      description: |
        Derives program accounts/PDAs from strategist, investor, vault, or vaultId.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxResolveAccountsBody"
      responses:
        "200":
          description: Derived account map (programId, protocolConfig, license*, vault*, investor*, …)

  /v1/tx/lock-license:
    post:
      tags: [Tx · Setup]
      summary: Prep lock_license tx
      description: |
        Builds unsigned license-lock transaction required before creating vaults.
        Activates the strategist licence **record**; 1VL is transferred into the vault on `create_vault`.

        Prepared `accounts` may include: `strategistAccount`, `license`, `licenseVault`, `licenseMint`, `strategistLicenseAta`.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxStrategistOnlyBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/create-vault:
    post:
      tags: [Tx · Setup]
      summary: Prep create_vault tx
      description: |
        Builds unsigned create-vault tx. Client must co-sign with a fresh `vaultTokenAccount` keypair.
        `vaultType` is encoded on-chain as book mode (pooled=0, sliced=1) plus a u16 param
        (0 for pooled; default 1000 management-fee bps for sliced).
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxCreateVaultBody"
      responses:
        "200":
          description: Prepared fields + vaultType* (see VaultTypeFields)

  /v1/tx/park:
    post:
      tags: [Tx · Capital]
      security: [{ bearerAuth: [] }]
      summary: Prep park/deposit tx (auth)
      description: |
        Builds unsigned deposit (park) tx. Optional `recordIntent` creates a ledger deposit intent when the investor wallet is owned by the caller.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxParkBody"
      responses:
        "200":
          description: "`{ prepared: PreparedTx, depositIntentId?: number }`"
  /v1/tx/park-guest:
    post:
      tags: [Tx · Capital]
      summary: Prep park/deposit tx (no auth)
      description: |
        Same body as park, without requiring login — for guest/demo flows.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxParkBody"
      responses:
        "200":
          description: "`{ prepared: PreparedTx, depositIntentId?: number }`"
  /v1/tx/withdraw:
    post:
      tags: [Tx · Capital]
      summary: Prep withdraw/redeem tx
      description: |
        Builds an unsigned **free withdraw** transaction: investor burns vault shares and receives
        native SOL (wSOL ATA is created, funded from vault liquidity, then closed to unwrap).

        **Single transaction includes:**
        1. `update_nav` — refresh vault NAV before pricing
        2. Create investor wSOL ATA (idempotent)
        3. Create investor share ATA (idempotent)
        4. `create_investor_config` (idempotent) — only if the PDA does not exist yet
        5. `withdraw` — burn shares, transfer liquid wSOL to investor
        6. Close wSOL ATA → native SOL to investor wallet

        **On-chain `withdraw` accounts (devnet build):**
        `investor`, `protocol_config`, `vault`, `investor_share_account`, `investor_token_account`,
        `vault_token_account`, `share_mint`, `investor_config`, `token_program`.

        **Signer:** investor only (`feePayer` = investor).

        **Shares:** pass raw share units (same decimals as vault base mint). Redeem is pro-rata on NAV;
        ensure `shares` ≤ on-chain share ATA balance and ≤ liquid wSOL cap
        (`vault_ata_lamports * total_shares / nav`).

        Resolve vault with `vault` pubkey or `strategist` + `vaultId`.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxWithdrawBody"
            example:
              investor: ETCBEqkrKYM6S7M7nqAJadmkDKZrTmftZLwsaoXFtpMR
              strategist: 9WDdee1AwqRCJ2WSr9dDAcaoCXPkfd19vR5RQdc2zcan
              vault: 51UmWAMsiQxJ4gngVabo7r7pRJx63marsxNppby8UmsW
              vaultTokenAccount: 2jaFKaHeykPWtXzJ1U9B8WtepiPweXdYheAAdQkEW6F3
              shares: 110000000
      responses:
        "200":
          description: |
            PreparedTx with `accounts.investorShareAta`, `investorWsolAta`, `shareMint`, `investorConfig`.

  /v1/tx/investor-config:
    post:
      tags: [Tx · Follow]
      summary: Prep create investor config
      description: |
        Creates investor config account (TP/SL and related settings) before following a vault.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxInvestorConfigBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/update-investor-config:
    post:
      tags: [Tx · Follow]
      summary: Prep update investor config
      description: |
        Updates an existing investor config (risk params / autoFollow / allocation).
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxUpdateInvestorConfigBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/follow-on:
    post:
      tags: [Tx · Follow]
      summary: Prep follow_on (start copying vault)
      description: |
        Turns follow mode on so the investor participates in strategist trades.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxFollowBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/follow-off:
    post:
      tags: [Tx · Follow]
      summary: Prep follow_off (stop copying vault)
      description: |
        Turns follow mode off for the investor on that vault.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxFollowBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/request-trade:
    post:
      tags: [Tx · Trade]
      summary: Prep request_trade (buy/sell intent)
      description: |
        Builds unsigned trade request. Also returns auto `executeTrade` unless `skipExecuteTrade=true`.
        DEX program is auto-picked from `PROGRAM_IDS`.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxRequestTradeBody"
      responses:
        "200":
          description: "`{ requestTrade, note, autoDex?, executeTrade? }`"
  /v1/tx/execute-trade:
    post:
      tags: [Tx · Trade]
      summary: Prep execute_trade (fill on DEX)
      description: |
        Builds unsigned execute_trade. Provide ATA pair **or** mints + vaultTokenAccount + action for derivation.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxExecuteTradeBody"
      responses:
        "200":
          description: "`{ executeTrade, autoDex? }`"
  /v1/tx/exit-position:
    post:
      tags: [Tx · Trade]
      summary: Prep exit position by percent
      description: |
        Exits a position by percent/bps. Optional `alsoRequestSell` attaches sell request + execute trade.
        `proceeds=0` auto-fills from market quote when inputMint+baseAmount provided.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxExitPositionBody"
      responses:
        "200":
          description: "`{ exit, exitBps, proceeds, sellTrade?, executeTrade?, priceQuote?, … }`"
  /v1/tx/reduce-position:
    post:
      tags: [Tx · Trade]
      summary: Prep reduce_position (partial exit)
      description: |
        Partial position reduce by `exitBps` (1–10000) or `exitPercent`.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxReducePositionBody"
      responses:
        "200":
          description: "`{ reduce, proceeds, exitBps, priceQuote?, … }`"
  /v1/tx/open-position:
    post:
      tags: [Tx · Trade]
      summary: Prep open_position
      description: |
        Opens a new vault position after a successful buy fill (accounting step).
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxOpenPositionBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/close-position:
    post:
      tags: [Tx · Trade]
      summary: Prep close_position
      description: |
        Fully closes a position record after exit/sell accounting.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxClosePositionBody"
      responses:
        "200":
          description: "`{ close, proceeds, priceQuote?, … }`"
  /v1/tx/accrue-fees:
    post:
      tags: [Tx · Fees]
      summary: Prep accrue_fees
      description: |
        Accrues performance/management fees on-chain for the vault.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxAccrueFeesBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/claim-fees:
    post:
      tags: [Tx · Fees]
      summary: Prep claim_fees
      description: |
        Claims accrued fees. `feeWallet` defaults to cluster `strategiesFeeWallet`.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxClaimFeesBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/initiate-close:
    post:
      tags: [Tx · Close]
      summary: Prep initiate vault close
      description: |
        Starts the vault close workflow (wind-down).
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxInitiateCloseBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/update-nav:
    post:
      tags: [Tx · Fees]
      summary: Prep update_nav
      description: |
        Updates vault NAV on-chain after trades/exits.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxNavKeeperBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/keeper-refresh:
    post:
      tags: [Tx · Fees]
      summary: Prep keeper refresh
      description: |
        Keeper/maintenance instruction to refresh vault state.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxNavKeeperBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/close-vault:
    post:
      tags: [Tx · Close]
      summary: Prep close_vault
      description: |
        Finalizes vault close. Optional `holders` overrides default investors with shares>0.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxCloseVaultBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/unlock-license:
    post:
      tags: [Tx · Close]
      summary: Prep unlock_license
      description: |
        Unlocks the strategist license after vault close path completes.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxStrategistOnlyBody"
      responses:
        "200":
          description: PreparedTx

  /v1/tx/submit:
    post:
      tags: [Tx · Submit]
      summary: Submit signed transaction
      description: |
        Broadcasts a client-signed base64 transaction to the cluster RPC.
        Pass `signerDetails` from the prepared tx so the backend can merge ephemeral/keeper co-signatures.
        After broadcast, confirm + indexer ingest run **async** (default when indexer configured).
        Optional `depositIntentId` marks a ledger intent submitted.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TxSubmitBody"
      responses:
        "200":
          description: Transaction submitted; poll status for confirm + ingest
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/TxSubmitResponseData"
        "422":
          description: MISSING_EOA_SIGNATURE or validation error
  /v1/tx/status/{signature}:
    get:
      tags: [Tx · Submit]
      summary: Get transaction confirmation status
      description: |
        Polls RPC for confirmation/finalization status of a submitted signature.
        After `/v1/tx/submit`, `ingest` is filled when background confirm+ingest completes.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: signature
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RPC status + optional ingest result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/TxStatusResponseData"
  /v1/flows:
    post:
      tags: [Flows]
      summary: Start async multi-step flow
      description: |
        Creates a multi-step job. Mode-specific required fields on `FlowStartParams`:
        - `create-vault`: vaultTokenAccount, vaultId; optional vaultType, investors with lamports
        - `deposit`: investors[] with lamports each
        - `configure-follow`: investors[]
        - `withdraw`: `vault` (or strategist+vaultId), `investors[0]` with `pubkey` + `shares`.
          One async step (`withdraw`); investor signs a bundled tx (update_nav + ATAs + withdraw + unwrap).
          No strategist signature required. Free redeem — no platform withdraw fee on MVP program.
        - `open-position`: outputMint, tradeId, amount
        - `exit-position`: positionId, tradeId, inputMint
        - `claim-fees` / `close-vault`: strategist (+ vault resolve as needed)
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowStartParams"
      responses:
        "201":
          description: FlowJob (often awaiting_signature on first step)
    get:
      tags: [Flows]
      summary: List flows
      description: |
        Lists async flows (limit 20). Filter by strategist, investor pubkey in params, or status.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: strategist
          in: query
          schema: { type: string }
        - name: investor
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, awaiting_signature, confirming, completed, failed, cancelled]
      responses:
        "200":
          description: "`{ items: FlowJob[] }`"
  /v1/flows/{id}:
    get:
      tags: [Flows]
      summary: Get flow status
      description: |
        Returns current step, prepared tx (if any), and status for one flow.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: FlowJob

  /v1/flows/{id}/submit:
    post:
      tags: [Flows]
      summary: Submit current flow step
      description: |
        Submits the signed transaction for the flow’s current waiting step and advances the job.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedTransaction]
              properties:
                signedTransaction: { type: string, description: "Base64 signed tx for the awaiting step" }
      responses:
        "200":
          description: FlowJob after submit

  /v1/flows/{id}/cancel:
    post:
      tags: [Flows]
      summary: Cancel a flow
      description: |
        Cancels a running/pending async flow.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: FlowJob (status cancelled)

  /v1/strategists/{pubkey}:
    get:
      tags: [Actors]
      summary: Get strategist profile
      description: |
        Indexed strategist account/profile plus vaults (each with vaultType*).
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:

        "200":
          description: Follow events
  /v1/leaderboard:
    get:
      tags: [Actors]
      summary: Top 10 vault leaderboard
      description: |
        Returns at most **10** vaults ranked by profit (`return_pct`) descending.
        Tie-break: higher `nav` first.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      responses:
        "200":
          description: "`{ items (≤10), limit: 10, orderBy: return_pct }`"
  /v1/trades:
    get:
      tags: [Actors]
      summary: List indexed trades
      description: |
        Trade feed from the indexer. Omit `vault` for a global recent feed, or pass `vault` to filter one vault PDA.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: vault
          in: query
          required: false
          schema: { type: string }
          description: Optional vault pubkey filter
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: "`{ items, vault, limit }`"
  /v1/auth/twitter/start:
    get:
      tags: [Auth]
      summary: Start Twitter OAuth login
      description: |
        Returns the Twitter OAuth URL (PKCE). Redirect the user to `data.url` to begin login.

        Optional `returnTo` — full callback URL on an allowed origin (must match `CORS_ORIGINS` or `FRONTEND_URL`).
        Stored in `auth_states.return_to` and used after Twitter redirects to `/v1/auth/twitter/callback`
        to send tokens to the client app hash: `{returnTo}#accessToken=…&refreshToken=…`.

        **simulator-v2:** `GET /v1/auth/twitter/start?returnTo=http://localhost:5174/auth/callback`

        On success the backend upserts `users.twitter_id` (unique) and issues JWT + refresh token.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            format: uri
          description: Client OAuth landing page (origin must be in CORS_ORIGINS)
      responses:
        "200":
          description: OAuth URL
  /v1/auth/twitter/callback:
    get:
      tags: [Auth]
      summary: Twitter OAuth callback
      description: |
        Exchanges the OAuth code for 1Vault access/refresh tokens after Twitter redirects back.

        Upserts `users` row (`twitter_id`, `handle`, `display_name`, `avatar_url`) and inserts `refresh_tokens`.
        Browser redirect (when `returnTo` was set or `Accept: text/html`): `{returnTo}#accessToken=…&refreshToken=…`.
        JSON response when `Accept: application/json` and no `returnTo`.
      responses:
        "200":
          description: Tokens
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT session
      description: |
        Rotates access (and refresh) tokens using a valid refresh token.
      responses:
        "200":
          description: Rotated tokens
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout / revoke session
      description: |
        Invalidates the current refresh session.
      responses:
        "200":
          description: Logged out
  /v1/auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current user profile
      description: |
        Returns the authenticated user profile and linked wallets.
      responses:
        "200":
          description: Profile
  /v1/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current user profile (alias)
      description: |
        Alias of `/v1/auth/me`.
      responses:
        "200":
          description: Profile alias
  /v1/wallets/nonce:
    get:
      tags: [Account · Wallets]
      security: [{ bearerAuth: [] }]
      summary: Get wallet bind nonce message
      description: |
        Returns a message for the user to sign with their Solana wallet to prove ownership before binding.
      parameters:
        - name: pubkey
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Nonce message
  /v1/wallets/bind:
    post:
      tags: [Account · Wallets]
      security: [{ bearerAuth: [] }]
      summary: Bind Solana wallet to account
      description: |
        Submits the signed nonce to attach a Solana **EOA** (individual) pubkey to the logged-in user.
        Vault PDAs (`walletKind=pda`) are rejected with `WALLET_KIND_INVALID`. Bound wallets return `walletKind=eoa`.
        `rolePreference`: `strategies` (Strategies) or `investors` (Investors). Legacy `degen`/`retail` accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey, signature, nonce]
              properties:
                pubkey: { type: string }
                signature: { type: string }
                nonce: { type: string }
                rolePreference: { $ref: "#/components/schemas/RolePreference" }
                primary: { type: boolean }
      responses:
        "200":
          description: "Bound wallet (`walletKind=eoa`, `rolePreference` strategies|investors)"
        "422":
          description: Vault PDA cannot be bound / invalid rolePreference
  /v1/ledger/deposits:
    get:
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      summary: List deposit intents
      description: |
        Lists off-chain deposit intents for an investor (optional vault filter).
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: investor
          in: query
          required: true
          schema: { type: string }
        - name: vault
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "`{ items: DepositIntent[] }` (roles rewritten to strategies|investors)"
    post:
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      summary: Create deposit intent
      description: |
        Creates an off-chain deposit intent before (or alongside) preparing an on-chain park tx.
        Investor must be a bound wallet of the authenticated user.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerDepositCreateBody"
      responses:
        "201":
          description: "`{ id, status: pending, role, roleLabel }`"
  /v1/ledger/deposits/{id}/submit:
    post:
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      summary: Mark deposit intent submitted
      description: |
        Marks a deposit intent as submitted after the on-chain tx is broadcast.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerDepositSubmitBody"
      responses:
        "200":
          description: "`{ id, signature, status: submitted }`"
  /v1/ledger/deposits/{id}/fail:
    post:
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      summary: Mark deposit intent failed
      description: |
        Marks a deposit intent as failed (user cancelled / tx failed).
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerDepositFailBody"
      responses:
        "200":
          description: "`{ id, status: failed }`"
  /v1/ledger/mandates:
    get:
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      summary: List investor mandates
      description: |
        Lists investor mandate/config records stored off-chain.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: investor
          in: query
          required: true
          schema: { type: string }
        - name: vault
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "`{ items: Mandate[] }`"
    post:
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      summary: Upsert investor mandate
      description: |
        Create or update an investor mandate (risk limits / follow preferences stored off-chain).
        Defaults: `role=investors`, `parkAmount="0"`, `autoFollow=true`.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerMandateBody"
      responses:
        "200":
          description: "`{ ok: true, role, roleLabel }`"
  /v1/ingest:
    post:
      tags: [System]
      summary: Admin indexer ingest hook
      description: |
        Admin-only endpoint to push a signature to the indexer. Requires `X-Admin-Key`.
      parameters:
        - $ref: "#/components/parameters/ClusterQuery"
        - name: X-Admin-Key
          in: header

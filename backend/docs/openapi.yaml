          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBody"
      responses:
        "200":
          description: Proxied indexer response

  /v1/tx/register-strategist:
    post:
      tags: [Tx · Setup]
      summary: Prep register_strategist tx
      description: |
        Builds an unsigned `register_strategist` transaction. Client signs and posts to `/v1/tx/submit`.

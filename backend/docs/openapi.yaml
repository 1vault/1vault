          required: true
          schema: { type: string }
          description: On-chain account pubkey
      responses:
        "200":
          description: NAV snapshots
  /v1/vaults/{pubkey}/payouts:
    get:
      tags: [Vaults]
      summary: Vault close payouts
      description: |
        Payout records related to vault close / investor distributions.
      parameters:
